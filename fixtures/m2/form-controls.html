<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M2 Fixture: Form Controls</title>
  <style>
    /* Hostile baseline styles to verify theme override. */
    body { font-family: serif; background: #ff00ff; color: #00ff00; }
    button { border-radius: 99px; background: #ff0000; color: #ffffff; }
    input, select, textarea { border: 4px dashed #0000ff; background: #ffff00; }
  </style>
</head>
<body>
  <h1>Form Controls</h1>
  <form>
    <label>Text <input type="text" value="sample"></label>
    <label>Email <input type="email" value="a@b.com"></label>
    <label>Password <input type="password" value="secret"></label>
    <label>Search <input type="search" value="query"></label>
    <label>Number <input type="number" value="42"></label>
    <label>URL <input type="url" value="https://example.com"></label>
    <label>
      Select
      <select>
        <option>One</option>
        <option selected>Two</option>
        <option>Three</option>
      </select>
    </label>
    <label>Textarea <textarea rows="4">Line one
Line two</textarea></label>
    <label><input type="checkbox" checked> Checkbox</label>
    <label><input type="radio" name="radio" value="a" checked> Radio A</label>
    <label><input type="radio" name="radio" value="b"> Radio B</label>
    <label>Range <input type="range" min="0" max="100" value="50"></label>
    <button type="submit">Submit</button>
    <button type="reset" disabled>Disabled</button>
    <input type="button" value="Button input">
  </form>
</body>
</html>
