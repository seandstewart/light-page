<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M2 Fixture: SPA Navigation</title>
  <style>
    body { background: #abcdef; color: #333; }
    .page { display: none; }
    .page.active { display: block; }
  </style>
</head>
<body>
  <h1>SPA Navigation</h1>
  <nav>
    <button data-path="/">Home</button>
    <button data-path="/about">About</button>
    <button data-path="/contact">Contact</button>
    <button id="hash-link">Hash route</button>
  </nav>

  <main id="app">
    <section class="page active" data-route="/">
      <h2>Home</h2>
      <p>This is the home view.</p>
      <button>Home action</button>
    </section>
    <section class="page" data-route="/about">
      <h2>About</h2>
      <p>This is the about view.</p>
      <input type="text" placeholder="About input">
    </section>
    <section class="page" data-route="/contact">
      <h2>Contact</h2>
      <p>This is the contact view.</p>
      <select><option>A</option><option>B</option></select>
    </section>
  </main>

  <script>
    const pages = document.querySelectorAll('.page');
    function show(path) {
      pages.forEach(p => p.classList.toggle('active', p.dataset.route === path));
    }

    document.querySelectorAll('nav button[data-path]').forEach(btn => {
      btn.addEventListener('click', () => {
        const path = btn.dataset.path;
        history.pushState({ path }, '', path);
      });
    });

    document.getElementById('hash-link').addEventListener('click', () => {
      location.hash = '#hash-view';
    });

    window.addEventListener('popstate', (e) => {
      show(e.state?.path || location.pathname);
    });

    window.addEventListener('hashchange', () => {
      if (location.hash === '#hash-view') {
        alert('Hash route changed (fixture)');
      }
    });

    show(location.pathname);
  </script>
</body>
</html>
